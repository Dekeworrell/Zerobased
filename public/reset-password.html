<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Zerobased</title>
  <link rel="icon" href="/assets/images/icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f4f2; color: #111; line-height: 1.6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border: 1px solid #e3e8e3; border-radius: 20px; padding: 36px; max-width: 400px; width: 100%; }
    .logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 24px; }
    .logo img { width: 36px; height: 36px; border-radius: 9px; }
    .logo-text { font-size: 18px; font-weight: 600; }
    .logo-text span { color: #3db870; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; text-align: center; }
    p.sub { font-size: 14px; color: #666; margin-bottom: 24px; text-align: center; }
    label { font-size: 13px; color: #666; display: block; margin-bottom: 6px; margin-top: 12px; }
    input { width: 100%; background: #f2f4f2; border: 1px solid #e3e8e3; border-radius: 12px; padding: 14px 16px; font-size: 16px; color: #111; }
    button { width: 100%; background: #3db870; border: none; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; margin-top: 20px; }
    button:disabled { opacity: 0.5; }
    .msg { font-size: 14px; text-align: center; margin-top: 16px; }
    .msg.error { color: #d64545; }
    .msg.success { color: #1a7a44; }
    .back { display: block; text-align: center; margin-top: 20px; font-size: 14px; color: #3db870; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/assets/images/icon.png" alt="Zerobased" />
      <span class="logo-text">Zero<span>based</span></span>
    </div>
    <h1>Set a new password</h1>
    <p class="sub">Enter a new password for your account.</p>

    <div id="form">
      <label for="pw">New password</label>
      <input type="password" id="pw" placeholder="At least 6 characters" />
      <label for="pw2">Confirm password</label>
      <input type="password" id="pw2" placeholder="Re-enter password" />
      <button id="submit">Update password</button>
    </div>

    <div id="msg" class="msg"></div>
    <a href="/login" class="back">Back to login</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://tkldjaqcovjdiwjpnphf.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrbGRqYXFjb3ZqZGl3anBucGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNDgwMzYsImV4cCI6MjA4OTYyNDAzNn0.6OIagvDpoSODtaAIKzZKbRwD-A5PrUAmT46qdjEGNvg'
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const msg = document.getElementById('msg')
    const form = document.getElementById('form')

    document.getElementById('submit').addEventListener('click', async () => {
      const pw = document.getElementById('pw').value
      const pw2 = document.getElementById('pw2').value
      msg.className = 'msg'
      if (pw.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.className = 'msg error'; return }
      if (pw !== pw2) { msg.textContent = 'Passwords do not match.'; msg.className = 'msg error'; return }

      const { error } = await client.auth.updateUser({ password: pw })
      if (error) { msg.textContent = error.message; msg.className = 'msg error' }
      else {
        form.style.display = 'none'
        msg.textContent = '✅ Password updated! You can now log in with your new password.'
        msg.className = 'msg success'
      }
    })
  </script>
</body>
</html>
